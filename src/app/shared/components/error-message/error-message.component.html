<div class="error-section">
  <div class="skull">
    <div class="head">
      <div class="crack"></div>
    </div>
    <div class="mouth">
      <div class="teeth"></div>
    </div>
  </div>
  <p class="strong">{{ message }}</p>
  <p *ngIf="offline">You're offline and this page hasn't been read on this device yet. Visit it once with a connection and it will be available offline.</p>
  <p *ngIf="!offline">Something went wrong loading this page. Try again in a moment.</p>
</div>
